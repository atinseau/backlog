services:
  backlog-server:
    # Pull from GHCR by default. To build locally instead, comment `image:` and
    # uncomment the `build:` block below.
    image: ghcr.io/osmove/backlog-server:latest
    # build:
    #   context: ../..
    #   dockerfile: packages/server/Dockerfile
    container_name: backlog-server
    ports:
      - "3002:3002"
    volumes:
      - backlog-server-data:/data
    environment:
      LOG_LEVEL: info
      BACKLOG_SERVER_CORS_ORIGIN: "*"
    restart: unless-stopped

volumes:
  backlog-server-data:
