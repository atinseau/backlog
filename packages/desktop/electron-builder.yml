appId: com.osmove.backlog
productName: Backlog
copyright: Copyright © 2026 Jimmy Douieb
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarization is required for the DMG to open on someone else's
  # Mac without the "unidentified developer" friction. Credentials
  # are read entirely from env: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
  # APPLE_TEAM_ID. Setting `notarize: true` here just turns the step
  # on; `false` (or omitting) skips it for dev builds.
  notarize: true
  # entitlements.mac.plist below grants only what the app needs:
  # network access (the embedded Hono server), JIT (V8 + Electron),
  # child-process spawning (claude / codex CLIs), worktree git ops.
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  icon: assets/icon.png
dmg:
  contents:
    - x: 130
      y: 220
      type: link
      path: /Applications
    - x: 410
      y: 220
      type: file

# Linux: AppImage is the universal target — single executable, no
# install required, auto-updates via electron-updater out of the box.
# .deb / .rpm cover the package-manager users (Ubuntu/Debian + Fedora/
# RHEL). No code signing on Linux; AppImage runs unsigned without any
# warning, and distros sign packages themselves at the repo level.
linux:
  category: Development
  synopsis: The task orchestrator for AI coding agents
  description: |
    Backlog runs entirely locally — kanban board, AI splitter, run
    orchestrator, claim-based file locking, and a pre-commit hook that
    keeps two agents from stepping on the same files.
  # Override artifact filename — the workspace package name is
  # `@backlog/desktop`, which contains a `/` and `@`. electron-builder
  # would otherwise template that into the filename verbatim, producing
  # `release/@backlog/desktop_1.4.0_amd64.deb` (the `/` makes it a
  # subdir, then dpkg-deb errors on the missing parent). Force the
  # name to a clean lowercase ascii string. ${ext} resolves to
  # AppImage / deb / rpm per target.
  artifactName: "Backlog-${version}-${arch}.${ext}"
  executableName: backlog-desktop
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64]
  icon: assets/icon.png
  desktop:
    entry:
      Name: Backlog
      Comment: Task orchestrator for AI coding agents
      Categories: Development;IDE;
      Keywords: backlog;tasks;kanban;ai;agents;
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# Windows: NSIS is the standard installer (auto-update via
# electron-updater, Start menu shortcut, Add/Remove Programs entry,
# uninstaller). The `portable` target is a single .exe that runs
# from anywhere — useful for trial runs and policy-locked corporate
# laptops where the user can't install software.
#
# Code signing is intentionally NOT configured here — without an EV
# cert SmartScreen will flash "Windows protected your PC" on first
# launch, but the install completes fine. Once the cert ships, set
# `CSC_LINK` (PFX in base64) + `CSC_KEY_PASSWORD` env vars in CI and
# electron-builder picks them up automatically. No yaml changes needed.
win:
  artifactName: "Backlog-Setup-${version}-${arch}.${ext}"
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: assets/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Backlog
  uninstallDisplayName: Backlog Desktop
  # Portable target (the single-exe build) writes its own filename
  # so it doesn't collide with the NSIS installer in releases/.
portable:
  artifactName: "Backlog-Portable-${version}-${arch}.${ext}"

asar: true

# Auto-update: GitHub Releases is the cheapest reliable channel —
# no infra, free bandwidth via GitHub's CDN, electron-updater reads
# `latest-mac.yml` natively. Each release uploaded under v<version>
# replaces the previous one for the auto-update channel.
publish:
  - provider: github
    owner: osmove
    repo: backlog
    releaseType: release
