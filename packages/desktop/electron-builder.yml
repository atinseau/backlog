appId: com.osmove.backlog
productName: Backlog
copyright: Copyright © 2026 Jimmy Douieb
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarization is required for the DMG to open on someone else's
  # Mac without the "unidentified developer" friction. Credentials
  # are read entirely from env: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
  # APPLE_TEAM_ID. Setting `notarize: true` here just turns the step
  # on; `false` (or omitting) skips it for dev builds.
  notarize: true
  # entitlements.mac.plist below grants only what the app needs:
  # network access (the embedded Hono server), JIT (V8 + Electron),
  # child-process spawning (claude / codex CLIs), worktree git ops.
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  icon: assets/icon.png
dmg:
  contents:
    - x: 130
      y: 220
      type: link
      path: /Applications
    - x: 410
      y: 220
      type: file
asar: true

# Auto-update: GitHub Releases is the cheapest reliable channel —
# no infra, free bandwidth via GitHub's CDN, electron-updater reads
# `latest-mac.yml` natively. Each release uploaded under v<version>
# replaces the previous one for the auto-update channel.
publish:
  - provider: github
    owner: osmove
    repo: backlog
    releaseType: release
