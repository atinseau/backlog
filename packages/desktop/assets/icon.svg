<?xml version="1.0" encoding="UTF-8"?>
<!--
  Backlog app icon — matches the brand mark used on backlog.cloud.
  Yellow squircle (#ffd166) with a near-black "B" (#0b0b0e).
  Source design: backlog-cloud/public/og.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232" fill="#ffd166"/>
  <text x="512" y="752"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif"
        font-size="720"
        font-weight="700"
        fill="#0b0b0e"
        text-anchor="middle"
        letter-spacing="-30">B</text>
</svg>
