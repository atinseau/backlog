name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The board must exist before typecheck: packages/server/src/ui-assets.ts
      # imports files out of packages/board-ui/dist.
      - name: Build board UI
        run: bun run build:ui

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build binary
        run: bun run build

      - name: Smoke-test the binary
        run: |
          ./dist/backlog --version
          ./dist/backlog --help > /dev/null
